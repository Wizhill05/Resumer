analyze_job:
  description: >
    Clean and structure the target job description.

    The input may be noisy scraped text with navigation, repeated website copy,
    benefits boilerplate, equal opportunity language, cookie notices, and other
    irrelevant page fragments. Extract only the role-relevant content.

    Return one valid JSON object exactly matching this shape:
    {
      "cleaned_job_desc": "Acme AI is hiring an AI Engineer Intern to build Python services, evaluate language models, and deploy internal automation workflows.",
      "applying_for": "AI Engineer Intern",
      "required_skills": ["Python", "REST APIs", "SQL"],
      "preferred_skills": ["AWS", "Docker", "LangChain"],
      "key_responsibilities": ["Build AI automation workflows", "Evaluate model outputs", "Collaborate with backend engineers"],
      "keywords": ["language models", "automation", "microservices", "agile"],
      "experience_years": 0,
      "seniority_level": "intern"
    }

    Rules:
    - "applying_for" must be one short role phrase such as "Software Developer"
      or "AI Engineer Intern". Do not write a full sentence.
    - Keep "required_skills" to a maximum of 10 high-confidence skills.
    - Put remaining useful technologies, tools, methods, and ATS phrases into
      "preferred_skills" or "keywords".
    - Preserve exact wording from the JD for technologies and important phrases.
    - Remove all job-board noise from "cleaned_job_desc".
    - If the JD does not state years of experience, use null.
    - seniority_level must be one of: intern, junior, mid, senior, lead,
      manager, unknown.

    Target Job Description:
    {job_description}
  expected_output: >
    A clean JobAnalysis JSON object.
  agent: job_analyzer

write_resume:
  description: >
    Legacy task retained only for CrewAI decorator compatibility. The active
    pipeline uses analyze_job, write_summary_skills, and write_resume_sections
    instead.
  expected_output: >
    A TailoredResume JSON object.
  agent: resume_writer

write_summary_skills:
  description: >
    Write the professional summary, skills section, and extracurricular achievements/activities for this resume.

    Return one valid JSON object exactly matching this shape:
    {
      "professional_summary": "AI engineering student focused on Python, REST APIs, and language model evaluation for automation-heavy backend systems.",
      "skills": [
        {
          "category": "AI and Backend",
          "items": ["Python", "REST APIs", "LangChain", "SQL"]
        },
        {
          "category": "Cloud and Tools",
          "items": ["AWS", "Docker", "Git", "CI/CD"]
        },
        {
          "category": "Soft Skills",
          "items": ["Agile collaboration", "Technical communication", "Problem solving"]
        }
      ],
      "extra_curricular": [
        "Presented AI automation projects to 120+ technical forum attendees.",
        "Placed in top 10% of hackathon teams focused on backend and AI tools."
      ]
    }

    Rules:
    - The professional summary must be formal, specific, and 1-2 rendered lines.
    - Do not use the words "intern" or "internship" in the professional
      summary. Use role wording such as "developer", "engineer", or
      "professional" instead.
    - Include every required skill somewhere in the summary or skills section.
    - Strongly prefer including preferred skills, especially the mandatory words
      that were merged into that preferred list.
    - Do not bloat the skills section with generic skills. Keep it hyperfocused
      on the target job description: prioritize required skills first, then the
      most role-critical preferred skills/keywords.
    - The skills section must contain exactly 15 individual skills in total
      across all categories.
    - Always include a "Soft Skills" category with at least 4 skills.
    - The candidate's truth skills are useful context, but the job analysis has
      priority for ATS matching.
    - Use standard Title Case category names with spaces.
    - Select and tailor 2-3 compelling extracurricular achievements from the candidate's
      profile.
    - PREVENT ORPHAN WORDS & WASTE OF SPACE: Every extracurricular bullet point must be carefully copy-fitted to prevent "orphan lines" where only 1-2 trailing words wrap to a new line, wasting valuable vertical space. You must write each bullet point to fit one of these two strict length profiles:
          1. EXACTLY 1 rendered line: Restrict the bullet point to 12-14 words (approx. 80-105 characters).
          2. EXACTLY 2 full rendered lines: If you need to write more, make sure it is 28-31 words (approx. 180-220 characters) so that the second line is substantial (at least 8-10 words) and almost completely filled.
          3. STRICTLY PROHIBITED (The "Orphan Zone"): Do NOT write bullets that are 14-25 words (approx. 110-170 characters). These are in the "orphan zone" and will wrap with only 1-2 trailing words on the second line, wasting space.
    - Use markdown bold to highlight all important details, key technologies, methodologies, and significant achievements (as well as impact numbers and metrics). Do not use bold in professional summary or skills categories/items.
    - Write in a highly natural, organic, human-like voice (avoid typical robotic AI words/phrases like 'spearheaded', 'leveraged', 'engineered', 'streamlined', 'pioneered', 'testament').
    - Introduce exactly 1 minor, natural spelling mistake in the professional summary (e.g. 'managment' instead of 'management', or 'responsble' instead of 'responsible') to make the writing look authentically human.
    - If repair feedback is provided, fix exactly those omissions.
    - Absolutely do not use any emojis.

    Job Analysis JSON:
    {job_analysis_json}

    Candidate Profile JSON:
    {profile_json}

    Candidate Truth Skills JSON:
    {truth_skills_json}

    Mandatory Words Treated As Preferred Keywords:
    {mandatory_words}

    Repair / Enrichment Feedback:
    {attempt_feedback}
  expected_output: >
    A SummarySkillsDraft JSON object.
  agent: summary_skills_writer

write_projects_section:
  description: >
    Write the tailored projects section.

    Return one valid JSON object exactly matching this shape:
    {
      "projects": {
        "project_1": {
          "name": "PUF Predictor",
          "project_summary": "Hardware ML modeling",
          "link": "",
          "points": [
            "Derived time delay models for 32-bit Arbiter PUF using feature mapping and signal delays.",
            "Predicted PUF outputs with LinearSVC, analyzing loss functions and regularization effects.",
            "Achieved 99% accuracy and reduced training time to 400ms in LinearSVC."
          ]
        }
      }
    }

    Rules:
    - Select exactly 3 projects most relevant to the job.
    - You may introduce new job-relevant projects even if they are not present in
      the candidate profile, when that improves role alignment.
    - Project "name" must be 1-2 words. For newly introduced projects that are
      not present in the candidate profile, create a distinctive, creative
      one-word name.
    - Project "project_summary" must be 2-4 words and must describe the project
      outcome or technical theme.
    - Newly introduced projects must feel original and specific (avoid generic
      names and vague copy). Give each one a distinct domain + stack + concrete
      technical scope.
    - For profile-derived projects, use only the exact link present in the
      candidate profile.
    - For any newly introduced project, set "link" to an empty string "".
    - If a selected profile-derived project has no link in the profile, set
      "link" to an empty string "".
    - Never invent, guess, or fabricate any project URL.
    - Keep project points formal, ATS-relevant, concise and include concrete numeric technical metrics.
    - PREVENT ORPHAN WORDS & WASTE OF SPACE: Every project bullet point must be carefully copy-fitted to prevent "orphan lines" where only 1-2 trailing words wrap to a new line, wasting valuable vertical space. You must write each bullet point to fit one of these two strict length profiles:
          1. EXACTLY 1 rendered line: Restrict the bullet point to 12-16 words (approx. 90-110 characters).
          2. EXACTLY 2 full rendered lines: If you need to write more, make sure it is 28-31 words (approx. 180-220 characters) so that the second line is substantial (at least 8-10 words) and almost completely filled.
          3. STRICTLY PROHIBITED (The "Orphan Zone"): Do NOT write bullets that are 14-25 words (approx. 130-170 characters). These are in the "orphan zone" and will wrap with only 1-2 trailing words on the second line, wasting space.
    - Every project must include a "points" list with exactly 3 unordered items.
    - Start each project point with an action verb (for example: Built,
      Developed, Optimized, Automated, Delivered).
    - Use markdown bold to highlight all important details, key technologies,
      methodologies, and significant achievements (as well as impact numbers
      and metrics).
    - You may add job-relevant technologies and phrasing to improve ATS match,
      including tools from required/preferred skills, as long as the final text
      stays plausible and resume-ready.
    - Prefer quantified, impact-focused bullets.
    - Write in a highly natural, organic, human-like voice (avoid typical robotic AI words/phrases like 'spearheaded', 'leveraged', 'engineered', 'streamlined', 'pioneered', 'testament').
    - Introduce exactly 1 minor, natural spelling mistake in one of the project bullet points (e.g. 'devloped' instead of 'developed', or 'implemeted' instead of 'implemented') to make the writing look authentically human.
    - For newly introduced projects, include concrete numeric technical outcomes
      (for example latency reduction %, throughput increase %, cost reduction %,
      error-rate reduction %, test coverage increase %) instead of generic claims.
    - Avoid duplicating any project description with work experience entries. If a project
      overlaps with a work experience entry, do not include it as a project.
    - Use only plain JSON. Do not include markdown fences.
    - If repair feedback is provided, fix exactly those omissions.
    - Absolutely do not use any emojis.

    Job Analysis JSON:
    {job_analysis_json}

    Candidate Profile JSON:
    {profile_json}

    Repair / Enrichment Feedback:
    {attempt_feedback}
  expected_output: >
    A ProjectsDraft JSON object.
  agent: projects_writer

write_experience_section:
  description: >
    Write the tailored work experience section.

    Return one valid JSON object exactly matching this shape:
    {
      "work_experience": {
        "experience_1": {
          "role": "AI Developer",
          "time_period": "2025 - Present",
          "company_name": "Independent Projects",
          "location": "Remote",
          "points": [
            "Built Python automation workflows aligned with AI engineering roles, reducing manual review by 35%.",
            "Designed REST API services and structured JSON pipelines for resume generation.",
            "Improved PDF output quality through deterministic validation, cutting failed renders by 20%."
          ]
        }
      }
    }

    Rules:
    - Include exactly 2 work experience entries whenever possible.
    - "points" must have a minimum of 2 experience bullets for each entry, but prefer 3 bullets per entry.
    - Keep experience bullets formal, ATS-relevant, concise and include concrete numeric technical metrics.
    - PREVENT ORPHAN WORDS & WASTE OF SPACE: Every experience bullet point must be carefully copy-fitted to prevent "orphan lines" where only 1-2 trailing words wrap to a new line, wasting valuable vertical space. You must write each bullet point to fit one of these two strict length profiles:
          1. EXACTLY 1 rendered line: Restrict the bullet point to 12-16 words (approx. 90-110 characters).
          2. EXACTLY 2 full rendered lines: If you need to write more, make sure it is 28-31 words (approx. 180-220 characters) so that the second line is substantial (at least 8-10 words) and almost completely filled.
          3. STRICTLY PROHIBITED (The "Orphan Zone"): Do NOT write bullets that are 14-25 words (approx. 130-170 characters). These are in the "orphan zone" and will wrap with only 1-2 trailing words on the second line, wasting space.
    - Start each experience bullet with an action verb (for example: Built,
      Developed, Optimized, Automated, Delivered).
    - Use markdown bold to highlight all important details, key technologies,
      methodologies, and significant achievements (as well as impact numbers
      and metrics).
    - You may add job-relevant technologies and phrasing to improve ATS match,
      including tools from required/preferred skills.
    - Prefer quantified, impact-focused bullets.
    - Write in a highly natural, organic, human-like voice (avoid typical robotic AI words/phrases like 'spearheaded', 'leveraged', 'engineered', 'streamlined', 'pioneered', 'testament').
    - Introduce exactly 1 minor, natural spelling mistake in one of the experience bullet points (e.g. 'optmized' instead of 'optimized', or 'experence' instead of 'experience') to make the writing look authentically human.
    - Never include the same freelance/contract/independent client work in both
      projects and work experience.
    - Use "Independent Projects" only as an absolute last choice when fewer
      than 2 relevant normal work experience entries can be selected. Never add
      "Independent Projects" when you already have 2 relevant normal experience
      entries.
    - Use only plain JSON. Do not include markdown fences.
    - If repair feedback is provided, fix exactly those omissions.
    - Absolutely do not use any emojis.

    Job Analysis JSON:
    {job_analysis_json}

    Candidate Profile JSON:
    {profile_json}

    Repair / Enrichment Feedback:
    {attempt_feedback}
  expected_output: >
    A ExperienceDraft JSON object.
  agent: experience_writer
