analyze_job:
  description: >
    Clean and structure the target job description.

    The input may be noisy scraped text with navigation, repeated website copy,
    benefits boilerplate, equal opportunity language, cookie notices, and other
    irrelevant page fragments. Extract only the role-relevant content.

    Return one valid JSON object exactly matching this shape:
    {
      "cleaned_job_desc": "Acme AI is hiring an AI Engineer Intern to build Python services, evaluate language models, and deploy internal automation workflows.",
      "applying_for": "AI Engineer Intern",
      "required_skills": ["Python", "REST APIs", "SQL"],
      "preferred_skills": ["AWS", "Docker", "LangChain"],
      "key_responsibilities": ["Build AI automation workflows", "Evaluate model outputs", "Collaborate with backend engineers"],
      "keywords": ["language models", "automation", "microservices", "agile"],
      "experience_years": 0,
      "seniority_level": "intern"
    }

    Rules:
    - "applying_for" must be one short role phrase such as "Software Developer"
      or "AI Engineer Intern". Do not write a full sentence.
    - Keep "required_skills" to a maximum of 10 high-confidence skills.
    - Put remaining useful technologies, tools, methods, and ATS phrases into
      "preferred_skills" or "keywords".
    - Preserve exact wording from the JD for technologies and important phrases.
    - Remove all job-board noise from "cleaned_job_desc".
    - If the JD does not state years of experience, use null.
    - seniority_level must be one of: intern, junior, mid, senior, lead,
      manager, unknown.

    Target Job Description:
    {job_description}
  expected_output: >
    A clean JobAnalysis JSON object.
  agent: job_analyzer

write_resume:
  description: >
    Legacy task retained only for CrewAI decorator compatibility. The active
    pipeline uses analyze_job, write_summary_skills, write_resume_sections, and
    shorten_resume instead.
  expected_output: >
    A TailoredResume JSON object.
  agent: resume_writer

write_summary_skills:
  description: >
    Write only the professional summary and skills section for this resume.

    Return one valid JSON object exactly matching this shape:
    {
      "professional_summary": "AI engineering student focused on Python, REST APIs, and language model evaluation for automation-heavy backend systems.",
      "skills": [
        {
          "category": "AI and Backend",
          "items": ["Python", "REST APIs", "LangChain", "SQL"]
        },
        {
          "category": "Cloud and Tools",
          "items": ["AWS", "Docker", "Git", "CI/CD"]
        },
        {
          "category": "Soft Skills",
          "items": ["Agile collaboration", "Technical communication", "Problem solving"]
        }
      ]
    }

    Rules:
    - The professional summary must be formal, specific, and 1-2 rendered lines.
    - Do not use the words "intern" or "internship" in the professional
      summary. Use role wording such as "developer", "engineer", or
      "professional" instead.
    - Include every required skill somewhere in the summary or skills section.
    - Strongly prefer including preferred skills, especially the mandatory words
      that were merged into that preferred list.
    - Do not bloat the skills section with generic skills. Keep it hyperfocused
      on the target job description: prioritize required skills first, then the
      most role-critical preferred skills/keywords.
    - The skills section must contain exactly 15 individual skills in total
      across all categories.
    - Always include a "Soft Skills" category.
    - The candidate's truth skills are useful context, but the job analysis has
      priority for ATS matching.
    - Use standard Title Case category names with spaces.
    - If repair feedback is provided, fix exactly those omissions.

    Job Analysis JSON:
    {job_analysis_json}

    Candidate Truth Skills JSON:
    {truth_skills_json}

    Mandatory Words Treated As Preferred Keywords:
    {mandatory_words}

    Repair / Enrichment Feedback:
    {attempt_feedback}
  expected_output: >
    A SummarySkillsDraft JSON object.
  agent: summary_skills_writer

write_resume_sections:
  description: >
    Write only the projects, work experience, and extra-curricular sections.

    Return one valid JSON object exactly matching this shape:
    {
      "projects": {
        "project_1": {
          "name": "AI Resume Builder",
          "link": "",
          "domain": "AI Automation",
          "description": "Built a Python and FastAPI resume automation system using structured job analysis, PDF generation, Docker-ready services, and iterative quality checks."
        },
        "project_2": {
          "name": "SQL Analytics Dashboard",
          "link": "github.com/user/sql-dashboard",
          "domain": "Backend Analytics",
          "description": "Developed a SQL-backed analytics dashboard with REST APIs, clean data models, and deployment-ready service structure for business reporting workflows."
        },
        "project_3": {
          "name": "DevOps Agent Tools",
          "link": "github.com/user/docker-agent-tools",
          "domain": "Developer Tools",
          "description": "Created Dockerized automation tools for local AI workflows, improving repeatability and aligning Python services with cloud-native delivery practices."
        }
      },
      "work_experience": {
        "experience_1": {
          "role": "AI Developer",
          "time_period": "2025 - Present",
          "company_name": "Independent Projects",
          "location": "Remote",
          "points": [
            "Built Python automation workflows aligned with AI engineering and backend development roles.",
            "Designed REST API services and structured JSON pipelines for resume generation.",
            "Improved PDF output quality through deterministic validation and iterative refinement."
          ]
        }
      },
      "extra_curricular": [
        "Presented AI automation projects in technical forums.",
        "Participated in hackathons focused on backend and AI tools."
      ]
    }

    Rules:
    - Select 2-3 projects most relevant to the job.
    - You may introduce new job-relevant projects even if they are not present in
      the candidate profile, when that improves role alignment.
    - Newly introduced projects must feel original and specific (avoid generic
      names and vague copy). Give each one a distinct domain + stack + concrete
      technical scope.
    - For profile-derived projects, use only the exact link present in the
      candidate profile.
    - For any newly introduced project, set "link" to an empty string "".
    - If a selected profile-derived project has no link in the profile, set
      "link" to an empty string "".
    - Never invent, guess, or fabricate any project URL.
    - Include exactly 2 work experience entries whenever possible.
    - Keep descriptions and bullets formal, ATS-relevant, and concise.
    - You may add job-relevant technologies and phrasing to improve ATS match,
      including tools from required/preferred skills, as long as the final text
      stays plausible and resume-ready.
    - Prefer quantified, impact-focused bullets.
    - For newly introduced projects, include concrete numeric technical outcomes
      (for example latency reduction %, throughput increase %, cost reduction %,
      error-rate reduction %, test coverage increase %) instead of generic claims.
    - Do not claim business/revenue/user-growth metrics unless those numbers are
      explicitly present in the candidate profile or job description.
    - Avoid duplicating the exact same achievement across projects and work
      experience.
    - Never include the same freelance/contract/independent client work in both
      "projects" and "work_experience".
    - If there is overlap, keep that work in "work_experience" and replace the
      duplicate project with a different relevant project.
    - Specific anti-redundancy example:
      BAD: Projects includes "College Admissions Platform (Next.js, Supabase,
      Razorpay)" while work_experience also says "Freelance Full Stack Developer
      ... built a college admissions platform".
      GOOD: Keep "college admissions platform" only under work_experience, and
      in projects choose a different project (for example, "Agentic Resume
      Optimizer") so the two sections do not describe the same work.
    - Use "Independent Projects" only as an absolute last choice when fewer
      than 2 relevant normal work experience entries can be selected. Never add
      "Independent Projects" when you already have 2 relevant normal experience
      entries.
    - Use only plain JSON. Do not include markdown fences.
    - If enrichment feedback asks for fuller content, add depth without making
      the resume exceed one page.

    Job Analysis JSON:
    {job_analysis_json}

    Candidate Profile JSON:
    {profile_json}

    Repair / Enrichment Feedback:
    {attempt_feedback}
  expected_output: >
    A ResumeSectionsDraft JSON object.
  agent: resume_section_writer

shorten_resume:
  description: >
    The previous resume draft overflows by {overflow_lines} rendered lines.
    Your goal is to help it fit on ONE page.

    Your mission is to surgically trim AS LITTLE AS POSSIBLE.
    This system runs in an iterative loop, so conservative trimming is preferred
    over aggressive trimming.

    LINE-COST REFERENCE MODEL (estimate only):
    - Replace one long bullet with a tighter one-line bullet: saves ~0.5 to 1 line.
    - Remove one experience bullet: saves ~1.5 to 2 lines.
    - Tighten one project description paragraph: saves ~1 line.
    - Remove one project entry: saves ~4 to 6 lines.
    - Remove one entire experience entry: saves ~5 to 7 lines.
    - Remove one section header + body block: saves 2+ lines.

    MINIMAL-CHANGE STRATEGY:
    1. Estimate a cut plan targeting about {overflow_lines} lines.
    2. Start with micro-edits only.
    3. Remove whole bullets only if still needed after micro-edits.
    4. Remove whole project/experience entries only when overflow is large.
    5. Preserve required skills and ATS keywords wherever possible.

    STRICT GUARDRAILS:
    - Return the full valid TailoredResume JSON object.
    - Do not rewrite from scratch.
    - Prefer preserving Projects and Experience depth.
    - Never remove more than one full entry in a single iteration.
    - Keep at least 2 projects whenever possible.
    - Keep a Soft Skills category if the skills section is present.
    - If the skills section is present, keep exactly 15 individual skills total,
      focused on the target job description.
    - Do not introduce the words "intern" or "internship" in the professional
      summary/objective; keep developer/engineer style wording.
    - Do not touch education/personal info structure.

    Resume JSON to trim:
    {previous_json}

    Target Job Description:
    {job_description}
  expected_output: >
    The entire modified TailoredResume JSON object, containing all fields from previous_json but slightly shortened.
  agent: resume_shortener
