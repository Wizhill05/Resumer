[project]
name = "resumer"
version = "0.2.0"
description = "AI-powered tailored resume generator using CrewAI + NVIDIA NIM"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[google-genai,litellm]>=0.100.0",
    "markdown>=3.10.2",
    "python-frontmatter>=1.1.0",
    "playwright>=1.50.0",
    "pypdf>=5.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    # Legacy Streamlit UI (keep until Next.js is fully validated)
    "streamlit-ace>=0.1.1",
    "streamlit>=1.44.0",
    "selenium>=4.43.0",
    "webdriver-manager>=4.0.2",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.0",
    "chompjs>=1.4.0",
]
