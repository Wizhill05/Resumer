
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
    :root {
      --line-soft: #1a1d23;
      --text: #d8dde6;
      --muted: #6b7280;
      --event: #82b4ff;
      --warn: #f6bd3f;
      --bad: #e35a67;
      --good: #28cc67;
      --prompt-green: #3ddc84;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      margin: 0;
      background: #05070c;
      font-family: 'JetBrains Mono', monospace;
    }
    .log-shell {
      background: #05070c;
      padding: 0.55rem 0.65rem;
      height: 100vh;
      overflow-y: auto;
      box-sizing: border-box;
    }
    .log-shell::-webkit-scrollbar {
      width: 6px;
    }
    .log-shell::-webkit-scrollbar-track {
      background: transparent;
    }
    .log-shell::-webkit-scrollbar-thumb {
      background: #2a2d33;
      border-radius: 10px;
    }
    .log-row {
      display: grid;
      grid-template-columns: 76px 100px 1fr;
      gap: 8px;
      align-items: start;
      font-size: 0.78rem;
      line-height: 1.35;
      padding: 0.18rem 0.25rem;
      border-radius: 4px;
      margin-bottom: 1px;
      color: var(--text);
    }
    .log-row:hover {
      background: rgba(130, 180, 255, 0.05);
    }
    .log-time {
      color: var(--muted);
    }
    .log-stream {
      color: var(--prompt-green);
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .log-msg {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      tab-size: 4;
    }
    .log-section .log-msg { font-weight: 700; }
    .log-info .log-msg { color: var(--text); }
    .log-event .log-msg { color: var(--event); }
    .log-success .log-msg { color: var(--good); }
    .log-warn .log-msg { color: var(--warn); }
    .log-error .log-msg { color: var(--bad); }
  </style>
</head>
<body>
  <div id="log-shell" class="log-shell"><div class='log-row log-info'><span class='log-time'>23:22:58</span><span class='log-stream'>>>> STDOUT</span><pre class='log-msg'>Waiting for run...</pre></div></div>
  <script>
    const shell = document.getElementById('log-shell');
    if (shell) shell.scrollTop = shell.scrollHeight;
  </script>
</body>
</html>
